[package]
name = "git-worktree-fast"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mweinbach/worktree-fast"
readme = "README.md"
description = "Native Git worktrees with APFS checkout caching and dependency-ready workspaces"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
memchr = "2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
